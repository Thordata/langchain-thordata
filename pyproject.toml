[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "langchain-thordata"
version = "0.2.0"
description = "LangChain tools and Python client for the ThorData SERP API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "ThorData" },
]
keywords = ["langchain", "thordata", "serp", "search", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "langchain-core>=0.3,<2.0",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "langchain-tests>=1,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://www.thordata.com/"
Documentation = "https://doc.thordata.com/"

[tool.hatch.build.targets.wheel]
packages = ["langchain_thordata"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/examples",
  "/langchain_thordata",
  "/pyproject.toml",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
